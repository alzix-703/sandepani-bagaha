<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Sandepani Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at center, #1e1b4b, #0f172a, #020617); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.2); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        h2 { color: #38bdf8; font-size: 26px; margin-bottom: 10px; font-weight: 700; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155; background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 22px; text-align: center; letter-spacing: 8px; outline: none; margin-bottom: 20px; transition: all 0.3s ease; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #0d9488, #059669); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(13, 148, 136, 0.4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13, 148, 136, 0.6); }
        .flash { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; }
        .info-flash { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #bae6fd; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Verify OTP</h2>
        <p>Enter the 6-digit verification code sent to your email.</p>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              {% if 'OTP Sent' in message %}
                <div class="info-flash">{{ message }}</div>
              {% else %}
                <div class="flash">{{ message }}</div>
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="/verify-otp" method="POST">
            <input type="text" name="otp" placeholder="••••••" maxlength="6" required>
            <button type="submit" class="btn">Verify & Continue</button>
        </form>
    </div>
</body>
</html>
