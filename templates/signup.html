<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sandepani Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at center, #1e1b4b, #0f172a, #020617); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.2); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        h2 { text-align: center; margin-bottom: 8px; color: #38bdf8; font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #334155; background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 15px; outline: none; transition: all 0.3s ease; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(37, 99, 235,.4); margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }
        .flash { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <div class="subtitle">Join Sandepani School Portal</div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="/signup" method="POST">
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="student@gmail.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Get Verification OTP</button>
        </form>
        <div class="footer-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</body>
</html>
