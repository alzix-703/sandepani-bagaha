<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl w-full max-w-md animate__animated animate__fadeInDown border border-gray-700">
        <h2 class="text-2xl font-bold text-center text-blue-400 mb-6">🏫 School Student Portal</h2>
        
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Phone Number</label>
                <input type="text" name="phone" required class="w-full p-3 bg-gray-700 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full p-3 bg-gray-700 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Captcha: What is 2 + 2?</label>
                <input type="text" name="captcha" placeholder="Enter answer" required class="w-full p-3 bg-gray-700 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-lg transition transform active:scale-95">Login</button>
        </form>

        <hr class="my-6 border-gray-700">

        <h3 class="text-lg font-bold text-center text-green-400 mb-4">Create New Account</h3>
        <form action="/signup" method="POST" enctype="multipart/form-data" class="space-y-3">
            <input type="text" name="name" placeholder="Full Name" required class="w-full p-2.5 bg-gray-700 rounded-lg outline-none">
            <input type="text" name="class_sec" placeholder="Class & Section (e.g. 10th-A)" required class="w-full p-2.5 bg-gray-700 rounded-lg outline-none">
            <input type="text" name="phone" placeholder="Phone Number" required class="w-full p-2.5 bg-gray-700 rounded-lg outline-none">
            <input type="password" name="password" placeholder="Password" required class="w-full p-2.5 bg-gray-700 rounded-lg outline-none">
            
            <div>
                <label class="block text-xs text-gray-400 mb-1">Select Role</label>
                <select name="role" class="w-full p-2.5 bg-gray-700 rounded-lg outline-none text-white">
                    <option value="student">Student</option>
                    <option value="PM">Pradhan Mantri (Red Tick)</option>
                    <option value="Khel Mantri">Khel Mantri (Blue Tick)</option>
                    <option value="Shiksha Mantri">Shiksha Mantri (Blue Tick)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Upload Profile Picture * compulsory</label>
                <input type="file" name="profile_pic" accept="image/*" required class="w-full text-xs text-gray-400">
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 font-bold py-2.5 rounded-lg transition transform active:scale-95">Sign Up</button>
        </form>
    </div>
</body>
</html>
