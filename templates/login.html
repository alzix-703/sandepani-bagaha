<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sandepani Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #bb86fc; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #2c2c2c; color: #fff; box-sizing: border-box; }
        .pass-box { position: relative; }
        .eye-btn { position: absolute; right: 10px; top: 12px; cursor: pointer; user-select: none; }
        .captcha-box { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
        .captcha-code { background: #bb86fc; color: #000; padding: 8px 15px; font-weight: bold; letter-spacing: 3px; border-radius: 6px; }
        button { width: 100%; padding: 12px; border: none; background: #bb86fc; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #bb86fc; text-decoration: none; }
        .flash { color: #ff5252; text-align: center; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sandepani Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <input type="text" name="identifier" placeholder="Username ya Phone Number" required>
            <div class="pass-box">
                <input type="password" name="password" id="loginPass" placeholder="Password" required>
                <span class="eye-btn" onclick="togglePass('loginPass')">👁️</span>
            </div>
            <div class="captcha-box">
                <span class="captcha-code">{{ captcha }}</span>
                <small style="color:#aaa;">Reload page for new</small>
            </div>
            <input type="text" name="captcha" placeholder="Enter Captcha Code" required>
            <button type="submit">Login</button>
        </form>
        <div class="link">
            Don't have an account? <a href="/signup">Sign Up</a>
        </div>
    </div>
    <script>
        function togglePass(id) {
            let el = document.getElementById(id);
            el.type = el.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
